[package]
name = "douyin-downloader"
version = "1.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "native-tls", "json", "system-proxy"] }
serde_json = "1.0"
url = "2.5"
regex = "1.12"
tempfile = "3.27"
flate2 = "1.1"
tungstenite = "0.28"
rfd = "0.16"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
