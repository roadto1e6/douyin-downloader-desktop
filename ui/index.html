<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>抖音下载工具</title><link rel="stylesheet" href="style.css"></head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M5 16v4h14v-4"/></symbol>
<symbol id="i-link" viewBox="0 0 24 24"><path d="m10 14 4-4m-6 6-1 1a4.2 4.2 0 0 1-6-6l5-5a4.2 4.2 0 0 1 6 0m0 12a4.2 4.2 0 0 0 6 0l5-5a4.2 4.2 0 0 0-6-6l-1 1" transform="translate(1 0) scale(.9 1)"/></symbol>
<symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3Z"/></symbol>
<symbol id="i-audio" viewBox="0 0 24 24"><path d="M5 9v6m4-10v14m4-11v8m4-12v16m4-10v4"/></symbol>
<symbol id="i-both" viewBox="0 0 24 24"><rect x="7" y="7" width="14" height="14" rx="3"/><path d="M16 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2m5-5 5 3-5 3Z"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M3 9h18"/></symbol>
<symbol id="i-paste" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="4" rx="1.5"/><path d="M7 5H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2M8 12h8m-8 4h5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6L10 14M9 4H5a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 11 3 3 5-5"/></symbol>
</defs></svg>
<div class="app-shell">
<header class="app-header"><div class="brand"><span class="brand-icon"><svg><use href="#i-arrow"/></svg></span><div><span class="brand-name">抖音下载</span><span class="brand-note">收好每一个喜欢</span></div></div><span class="header-note"><span class="dot"></span>你的收藏，留在本地</span></header>
<main>
<section class="workspace" aria-labelledby="heading"><div class="intro"><span class="eyebrow">SAVE A LITTLE MOMENT</span><h1 id="heading">把喜欢的，留在本地。</h1><p>一次贴入多条链接，喜欢的片段一起收好。</p></div>
<form id="form" novalidate>
<div class="field-header"><label for="link"><span class="field-number">01</span>作品链接</label><div class="source-actions"><button id="import" class="quiet-button" type="button">导入 TXT</button><button id="clear" class="quiet-button" type="button" title="清空链接" hidden>清空</button></div></div>
<div class="input-wrap"><svg class="input-icon"><use href="#i-link"/></svg><textarea id="link" maxlength="131072" spellcheck="false" placeholder="粘贴多条抖音链接或分享文字…&#10;&#10;每批最多 100 条，自动识别重复链接。" aria-describedby="input-note"></textarea><button id="paste" class="paste-button" type="button"><svg><use href="#i-paste"/></svg>粘贴</button></div>
<p id="input-note" class="input-note" aria-live="polite">支持多条链接 · 每批最多 100 条</p>
<fieldset><legend><span class="field-number">02</span>保存什么</legend><div class="modes">
<label class="mode"><input type="radio" name="mode" value="both" checked><span class="selection"><svg><use href="#i-check"/></svg></span><svg class="mode-icon"><use href="#i-both"/></svg><strong>视频与音频</strong><span class="mode-format">MP4 + MP3</span></label>
<label class="mode"><input type="radio" name="mode" value="video"><span class="selection"><svg><use href="#i-check"/></svg></span><svg class="mode-icon"><use href="#i-video"/></svg><strong>仅视频</strong><span class="mode-format">MP4</span></label>
<label class="mode"><input type="radio" name="mode" value="audio"><span class="selection"><svg><use href="#i-check"/></svg></span><svg class="mode-icon"><use href="#i-audio"/></svg><strong>仅音频</strong><span class="mode-format">MP3</span></label>
</div></fieldset>
<div class="destination"><svg><use href="#i-folder"/></svg><div class="folder-info"><span>新任务保存到</span><p id="folder" title="">正在读取…</p></div><button id="choose" type="button" class="quiet-button">更改<svg><use href="#i-chevron"/></svg></button></div>
<div class="actions"><button class="primary" id="start" type="submit"><svg class="download-icon"><use href="#i-arrow"/></svg><span id="start-text">加入下载队列</span><span class="button-spinner" hidden></span></button><span class="shortcut"><kbd>Ctrl</kbd><span>+</span><kbd>Enter</kbd></span></div>
<p class="form-footnote">逐条下载 · 失败自动继续下一条</p>
</form></section>
<aside class="transfer queue-panel" aria-labelledby="panel-title">
<div class="panel-header"><span id="panel-title">下载工作台</span><span class="state-badge"><span></span><b id="label">准备就绪</b></span></div>
<div class="queue-stats"><div><strong id="stat-pending">0</strong><span>待处理</span></div><div><strong id="stat-done">0</strong><span>已保存</span></div><div><strong id="stat-error">0</strong><span>失败</span></div><button id="pause" type="button" class="queue-button" title="暂停后，当前任务仍会继续完成">暂停队列</button></div>
<p id="queue-message" class="queue-message">粘贴链接，开始建立你的收藏。</p>
<div id="warning" class="queue-warning" role="status" hidden></div>
<div class="queue-navigation"><div class="queue-tabs" role="tablist"><button type="button" role="tab" data-view="queue" aria-selected="true">队列 <span>0</span></button><button type="button" role="tab" data-view="history" aria-selected="false">历史 <span>0</span></button><button type="button" role="tab" data-view="error" aria-selected="false">失败 <span>0</span></button></div><button id="retry-all" type="button" class="queue-text-button">重试失败项</button></div>
<input id="search" type="search" placeholder="搜索作品或链接" aria-label="搜索任务">
<div id="task-list" class="task-list" role="list" aria-label="下载任务"></div>
<div id="empty-state" class="empty-state"><div class="transfer-visual" aria-hidden="true"><svg class="media-art" viewBox="0 0 320 180" fill="none"><ellipse class="art-orbit" cx="160" cy="105" rx="121" ry="55"/><path class="art-dash" d="M35 78h30m-15-15v30m207 27h21m-10-10v20"/><g class="art-sheet"><rect x="81" y="32" width="116" height="132" rx="12"/><rect class="art-inner" x="94" y="45" width="90" height="64" rx="6"/><path class="art-play" d="m130 62 25 15-25 15Z"/><path class="art-lines" d="M96 127h70m-70 12h45"/></g><g class="art-disc"><circle cx="211" cy="113" r="44"/><circle class="art-ring" cx="211" cy="113" r="33"/><circle class="art-ring" cx="211" cy="113" r="24"/><circle class="art-center" cx="211" cy="113" r="9"/></g><g class="art-check"><circle cx="251" cy="56" r="19"/><path d="m242 56 6 6 12-13"/></g></svg><div class="sound-bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
<h2 id="empty-title">等待一组好片段</h2><p id="empty-message">把链接贴在左侧，让收藏慢慢充实。</p></div>
<div class="queue-footer"><button id="cancel-all" type="button" class="queue-text-button">取消全部待处理</button><button id="export" type="button" class="queue-text-button">导出失败链接</button><button id="clear-history" type="button" class="queue-text-button">清除已结束记录</button><button id="open" type="button" class="queue-text-button">打开保存目录 ↗</button></div>
</aside>
</main>
<footer><span>支持抖音公开视频 · 任务历史保存在本机</span><span class="footer-right">MADE FOR YOUR COLLECTION<span class="footer-divider"></span>v1.2</span></footer>
</div><div class="toast" id="toast" role="status" hidden></div><script src="app.js"></script>
</body></html>
